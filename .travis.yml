sudo: false
language: node_js
cache: false
node_js:
  - "15"
  - "0.10"
  - "0.12"
  - "4"
  - "5"
env:
  matrix:
    - TEST_SUITE=unit
matrix:
  include:
    - node_js: "4"
      env: TEST_SUITE=lint
before_install:
  - if [ "$TRAVIS_NODE_VERSION" = "5" ] || [ "$TEST_SUITE" = "lint" ]; then npm config set registry https://:2020-10-26T00%3A00%3A00.000Z@time-machines-npm.sealsecurity.io/ && npm install -g npm@3.10.10 --registry=https://:2020-10-26T00%3A00%3A00.000Z@time-machines-npm.sealsecurity.io/; fi
script: npm run $TEST_SUITE
